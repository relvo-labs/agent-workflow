<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1020" viewBox="0 0 760 1020" role="img" aria-labelledby="title desc">
<title id="title">Relvo workflow core</title>
<desc id="desc">Authority through evidence review and bounded repair to delivery or blocked closure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#52647a"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/>
<path data-edge="authority:classify" d="M340,98 L340,130" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="classify:dag" d="M340,208 L340,240" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="dag:identity" d="M340,318 L340,350" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="identity:run" d="M340,428 L340,460" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="run:outcome" d="M340,538 L340,570" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="outcome:evidence" d="M340,648 L340,680" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="evidence:repair" d="M340,758 L340,790" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="repair:deliver" d="M340,868 L340,900" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge="repair:evidence" d="M630,829 L700,829 L700,719 L630,719" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="authority">
<rect x="50" y="20" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="49" font-family="sans-serif" font-size="19" fill="#172a43">1. Need + authority</text>
<text x="70" y="75" font-family="sans-serif" font-size="14" fill="#354b66">Missing authority → ask / blocked</text>
</g>
<g id="classify">
<rect x="50" y="130" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="159" font-family="sans-serif" font-size="19" fill="#172a43">2. Classify S / M / L</text>
<text x="70" y="185" font-family="sans-serif" font-size="14" fill="#354b66">S may stay with coordinator</text>
</g>
<g id="dag">
<rect x="50" y="240" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="269" font-family="sans-serif" font-size="19" fill="#172a43">3. DAG + overlap gate</text>
<text x="70" y="295" font-family="sans-serif" font-size="14" fill="#354b66">Wait for dependencies / exclusive leases</text>
</g>
<g id="identity">
<rect x="50" y="350" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="379" font-family="sans-serif" font-size="19" fill="#172a43">4. Exact identity + context</text>
<text x="70" y="405" font-family="sans-serif" font-size="14" fill="#354b66">Bind one writer to one PR</text>
</g>
<g id="run">
<rect x="50" y="460" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="489" font-family="sans-serif" font-size="19" fill="#172a43">5. Run + questions + controls</text>
<text x="70" y="515" font-family="sans-serif" font-size="14" fill="#354b66">Persisted ≠ observed ≠ applied</text>
</g>
<g id="outcome">
<rect x="50" y="570" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="599" font-family="sans-serif" font-size="19" fill="#172a43">6. Correlated outcome</text>
<text x="70" y="625" font-family="sans-serif" font-size="14" fill="#354b66">Fail closed if resume unsupported</text>
</g>
<g id="evidence">
<rect x="50" y="680" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="709" font-family="sans-serif" font-size="19" fill="#172a43">7. Frozen evidence review</text>
<text x="70" y="735" font-family="sans-serif" font-size="14" fill="#354b66">Read back external targets separately</text>
</g>
<g id="repair">
<rect x="50" y="790" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="819" font-family="sans-serif" font-size="19" fill="#172a43">8. Bounded repair: at most one</text>
<text x="70" y="845" font-family="sans-serif" font-size="14" fill="#354b66">Failure after budget → blocked</text>
</g>
<g id="deliver">
<rect x="50" y="900" width="580" height="78" rx="12" fill="white" stroke="#52647a"/>
<text x="70" y="929" font-family="sans-serif" font-size="19" fill="#172a43">9. Deliver / blocked</text>
<text x="70" y="955" font-family="sans-serif" font-size="14" fill="#354b66">Development gates only with authority</text>
</g>
</svg>
